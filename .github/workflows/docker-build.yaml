name: Docker Build

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile'
      - 'go.mod'
      - '.github/workflows/docker-build.yaml'
  pull_request:
    paths:
      - 'docker/Dockerfile'
      - 'go.mod'
      - '.github/workflows/docker-build.yaml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-build:
    name: Build docker/Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build image
        run: docker build -f docker/Dockerfile -t kumo:ci .

      - name: Smoke test image
        id: smoke
        run: |
          docker run -d --name kumo-smoke -p 127.0.0.1:4566:4566 -e KUMO_DATA_DIR=/data kumo:ci
          curl -fsS --max-time 5 --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:4566/health
          # On SIGTERM kumo snapshots every service into KUMO_DATA_DIR, so
          # s3.json only exists if the image's non-root user can write /data.
          docker stop kumo-smoke
          docker cp kumo-smoke:/data/s3.json - > /dev/null

      - name: Show kumo logs
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        run: docker logs kumo-smoke

      - name: Remove smoke test container
        if: always()
        run: docker rm -f kumo-smoke
