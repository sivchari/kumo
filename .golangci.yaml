version: "2"
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - cyclop
    - dogsled
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - forcetypeassert
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - staticcheck
    - tagliatelle
    - thelper
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl
  exclusions:
    rules:
      # AWS SQS API requires PascalCase JSON field names.
      - path: internal/service/sqs/types\.go
        linters:
          - tagliatelle
      # AWS DynamoDB API requires PascalCase JSON field names.
      - path: internal/service/dynamodb/types\.go
        linters:
          - tagliatelle
      # AWS Secrets Manager API requires PascalCase JSON field names.
      - path: internal/service/secretsmanager/types\.go
        linters:
          - tagliatelle
      # AWS SNS API requires PascalCase JSON field names.
      - path: internal/service/sns/types\.go
        linters:
          - tagliatelle
      # AWS Lambda API requires PascalCase JSON field names.
      - path: internal/service/lambda/types\.go
        linters:
          - tagliatelle
      # AWS SSM API requires PascalCase JSON field names.
      - path: internal/service/ssm/types\.go
        linters:
          - tagliatelle
      # AWS CloudWatch Logs API requires specific JSON field names.
      - path: internal/service/cloudwatchlogs/types\.go
        linters:
          - tagliatelle
      # AWS EC2 API requires PascalCase JSON field names.
      - path: internal/service/ec2/types\.go
        linters:
          - tagliatelle
      # AWS Athena API requires PascalCase JSON field names.
      - path: internal/service/athena/types\.go
        linters:
          - tagliatelle
      # AWS CodeConnections API requires PascalCase JSON field names.
      - path: internal/service/codeconnections/types\.go
        linters:
          - tagliatelle
      # AWS KMS API requires PascalCase JSON field names.
      - path: internal/service/kms/types\.go
        linters:
          - tagliatelle
      # AWS Global Accelerator API requires PascalCase JSON field names.
      - path: internal/service/globalaccelerator/types\.go
        linters:
          - tagliatelle
      # AWS Cognito API requires PascalCase JSON field names.
      - path: internal/service/cognito/types\.go
        linters:
          - tagliatelle
      # AWS EventBridge API requires PascalCase JSON field names.
      - path: internal/service/eventbridge/types\.go
        linters:
          - tagliatelle
      # AWS Kinesis API requires PascalCase JSON field names.
      - path: internal/service/kinesis/types\.go
        linters:
          - tagliatelle
      # AWS Step Functions API requires PascalCase JSON field names.
      - path: internal/service/sfn/types\.go
        linters:
          - tagliatelle
      # AWS ECR API requires PascalCase JSON field names.
      - path: internal/service/ecr/types\.go
        linters:
          - tagliatelle
      # AWS API Gateway API requires PascalCase JSON field names.
      - path: internal/service/apigateway/types\.go
        linters:
          - tagliatelle
      # AWS SES v2 API requires PascalCase JSON field names.
      - path: internal/service/sesv2/types\.go
        linters:
          - tagliatelle
      # AWS ACM API requires PascalCase JSON field names.
      - path: internal/service/acm/types\.go
        linters:
          - tagliatelle
      # AWS Glue API requires PascalCase JSON field names.
      - path: internal/service/glue/types\.go
        linters:
          - tagliatelle
      # AWS X-Ray API requires PascalCase JSON field names.
      - path: internal/service/xray/types\.go
        linters:
          - tagliatelle
      # AWS X-Ray segment document uses snake_case field names.
      - path: internal/service/xray/storage\.go
        linters:
          - tagliatelle
      # AWS Batch API requires specific JSON field names.
      - path: internal/service/batch/types\.go
        linters:
          - tagliatelle
      # AWS CloudWatch API requires PascalCase JSON field names.
      - path: internal/service/cloudwatch/types\.go
        linters:
          - tagliatelle
      # AWS Firehose API requires PascalCase JSON field names.
      - path: internal/service/firehose/types\.go
        linters:
