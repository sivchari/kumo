      # AWS RDS API requires PascalCase JSON field names.
      - path: internal/service/rds/types\.go
        linters:
          - tagliatelle
      # AWS ElastiCache API requires PascalCase JSON field names.
      - path: internal/service/elasticache/types\.go
        linters:
          - tagliatelle
      # AWS ELBv2 API requires PascalCase JSON field names.
      - path: internal/service/elbv2/types\.go
        linters:
          - tagliatelle
      # AWS CloudFormation API requires PascalCase JSON field names.
      - path: internal/service/cloudformation/types\.go
        linters:
          - tagliatelle
      # AWS CloudTrail API requires PascalCase JSON field names.
      - path: internal/service/cloudtrail/types\.go
        linters:
          - tagliatelle
      # AWS Config API requires PascalCase JSON field names.
      - path: internal/service/configservice/types\.go
        linters:
          - tagliatelle
      # AWS Forecast API requires PascalCase JSON field names.
      - path: internal/service/forecast/types\.go
        linters:
          - tagliatelle
      # AWS GameLift API requires PascalCase JSON field names.
      - path: internal/service/gamelift/types\.go
        linters:
