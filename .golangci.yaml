      # AWS Service Quotas API requires PascalCase JSON field names.
      - path: internal/service/servicequotas/types\.go
        linters:
          - tagliatelle
      # AWS Organizations API requires PascalCase JSON field names.
      - path: internal/service/organizations/types\.go
        linters:
          - tagliatelle
      # AWS EventBridge Pipes API requires PascalCase JSON field names and specific naming.
      - path: internal/service/pipes/types\.go
        linters:
          - tagliatelle
          - revive
      # AWS EMR Serverless API requires PascalCase JSON field names.
      - path: internal/service/emrserverless/types\.go
        linters:
          - tagliatelle
      # AWS App Mesh API requires PascalCase JSON field names.
      - path: internal/service/appmesh/types\.go
        linters:
          - tagliatelle
      # AWS EventBridge Scheduler API requires PascalCase JSON field names.
      - path: internal/service/scheduler/types\.go
        linters:
          - tagliatelle
      # AWS DLM API requires PascalCase JSON field names.
      - path: internal/service/dlm/types\.go
        linters:
          - tagliatelle
      # AWS SageMaker API requires PascalCase JSON field names.
      - path: internal/service/sagemaker/types\.go
        linters:
          - tagliatelle
      # AWS Route 53 Resolver API requires PascalCase JSON field names.
      - path: internal/service/route53resolver/types\.go
        linters:
          - tagliatelle
      # AWS Security Lake API requires specific JSON field names.
      - path: internal/service/securitylake/types\.go
        linters:
          - tagliatelle
      # AWS FinSpace API requires specific JSON field names.
      - path: internal/service/finspace/types\.go
        linters:
          - tagliatelle
      # AWS Comprehend API requires PascalCase JSON field names.
      - path: internal/service/comprehend/types\.go
        linters:
          - tagliatelle
      # AWS Resilience Hub API requires specific JSON field names.
      - path: internal/service/resiliencehub/types\.go
        linters:
          - tagliatelle
      # AWS Cost Explorer API requires PascalCase JSON field names.
      - path: internal/service/ce/types\.go
        linters:
          - tagliatelle
      # AWS Rekognition API requires PascalCase JSON field names.
      - path: internal/service/rekognition/types\.go
        linters:
          - tagliatelle
      # AWS MemoryDB API requires PascalCase JSON field names.
      - path: internal/service/memorydb/types\.go
        linters:
          - tagliatelle
      # AWS Glacier API requires PascalCase JSON field names.
      - path: internal/service/glacier/types\.go
        linters:
          - tagliatelle
      # AWS Elastic Beanstalk API requires PascalCase JSON field names.
      - path: internal/service/elasticbeanstalk/types\.go
        linters:
          - tagliatelle
      # AWS EBS API requires PascalCase JSON field names.
      - path: internal/service/ebs/types\.go
        linters:
          - tagliatelle
      # AWS STS API requires PascalCase JSON field names.
      - path: internal/service/sts/types\.go
        linters:
          - tagliatelle
      # AWS Backup API requires PascalCase JSON field names.
      - path: internal/service/backup/types\.go
        linters:
          - tagliatelle
      # AWS Data Exchange API requires PascalCase JSON field names.
      - path: internal/service/dataexchange/types\.go
        linters:
          - tagliatelle
      # AWS CodeGuru Reviewer API requires PascalCase JSON field names.
      - path: internal/service/codegurureviewer/types\.go
        linters:
          - tagliatelle
      # AWS Location Service API requires PascalCase JSON field names.
      - path: internal/service/location/types\.go
        linters:
          - tagliatelle
      # AWS Neptune API requires PascalCase JSON field names.
      - path: internal/service/neptune/types\.go
        linters:
          - tagliatelle
      # AWS DocumentDB API requires PascalCase JSON field names.
      - path: internal/service/documentdb/types\.go
        linters:
          - tagliatelle
      # AWS Redshift API requires PascalCase JSON field names.
      - path: internal/service/redshift/types\.go
        linters:
          - tagliatelle
      # AWS Cloud Control API + per-resource handlers use PascalCase
      # JSON field names that match AWS CloudFormation resource type
      # schemas. wrapcheck is excluded because handlers thinly proxy
      # cross-package storage interfaces; wrapping every storage error
      # adds noise without aiding diagnosis.
      - path: internal/service/cloudcontrol/.*\.go
        linters:
          - tagliatelle
          - wrapcheck
      # internal/registry blank-imports every service to register them via
      # init(); it is the single canonical service list.
      - path: internal/registry/registry\.go
        linters:
          - revive
      # G703 is a false positive here: blob refs are sha256 hex digests
      # derived from object bodies (bodyRefOf), never user-controlled
      # paths, and the flagged os calls operate on constant directories
      # and os.CreateTemp names. gosec's taint analysis fires on any
      # os.MkdirAll/Remove in a function that merely takes an io.Reader.
      - path: internal/service/s3/blob\.go
        linters: [gosec]
        text: "G703"
      # G703: build-time README generator reading repo-local paths only.
      - path: cmd/readme-gen/main\.go
        linters: [gosec]
        text: "G703"
      # G204: executing user-provided init scripts is the initdir feature.
      - path: internal/initdir/initdir\.go
        linters: [gosec]
        text: "G204"
      # G704/G705: connecting to user-configured endpoints and echoing
      # their responses is the emulator's purpose (AMP workspace proxy,
      # CloudFront origin fetch, EventBridge API destinations, Lambda
      # invocation, SFN HTTP tasks, ECS Exec endpoint, EBS blocks).
      - path: internal/service/amp/service\.go
        linters: [gosec]
        text: "G704"
      - path: internal/service/cloudfront/edge\.go
        linters: [gosec]
        text: "G704|G705"
      - path: internal/service/cloudfront/edge_test\.go
        linters: [gosec]
        text: "G705"
      - path: internal/service/ebs/handlers\.go
        linters: [gosec]
        text: "G705"
      - path: internal/service/eventbridge/storage\.go
        linters: [gosec]
        text: "G704"
      - path: internal/service/execapi/execapi\.go
        linters: [gosec]
        text: "G704"
      - path: internal/service/lambda/handlers\.go
        linters: [gosec]
        text: "G704"
      - path: internal/service/sfn/executor\.go
        linters: [gosec]
        text: "G704"
      - path: internal/service/sfn/itemreader\.go
        linters: [gosec]
        text: "G704"
      - path: internal/service/sfn/resultwriter\.go
        linters: [gosec]
        text: "G704"
      # G101: dummy EventBridge connection credentials in test fixtures.
      - path: internal/service/eventbridge/storage_test\.go
        linters: [gosec]
        text: "G101"
      # G118: notification/event delivery is intentionally fire-and-forget;
      # the request context would cancel delivery when the response
      # returns. G120: object_post enforces a real MaxBytesReader cap, but
      # gosec still flags the ParseMultipartForm call site regardless.
      - path: internal/service/s3/handlers\.go
        linters: [gosec]
        text: "G118|G705"
      - path: internal/service/s3/object_post\.go
        linters: [gosec]
        text: "G118|G120"
      # The gosec G115 suppression comments in these files are required by
      # golangci-lint v2.8's gosec but reported as unused by v2.13's.
      - path: internal/service/emrserverless/handlers\.go
        linters: [nolintlint]
        text: "is unused"
      - path: internal/service/pipes/handlers\.go
        linters: [nolintlint]
        text: "is unused"
      - path: internal/service/memorydb/storage\.go
        linters: [nolintlint]
        text: "is unused"
  settings:
    gocritic:
      enable-all: true
      disabled-checks:
        - importShadow
        - unnamedResult
    nolintlint:
      require-specific: true
      require-explanation: true
    cyclop:
      max-complexity: 15
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: bool-literal-in-expr
formatters:
  enable:
    - gofmt
    - gci
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - localmodule
